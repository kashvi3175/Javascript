<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

<body>
  <script>
    //map is like a key value pair can have any type of data creates a new array
    //syntax array.map((element/index/array)=>{ transformed value})

    //sample code 
    const numbers=[4,5,6];
    const doubled=numbers.map(num=>num*2);
    console.log(doubled);


    //using from objects
    const users=[
      {name:'bob',age:18},
       {name:'lia',age:18},
        {name:'haden',age:18},
    ];

    const names = users.map(user => user.name);

console.log(names);

//making text uppercase 
const student=['bob','rick','sam'];
const studentname=student.map(uppercasenames);
function uppercasenames(element){
  return element.toUpperCase();
}

console.log(studentname);




//using the indexes
const arr = ['a', 'b', 'c'];

const result = arr.map((value, index) => {
  return `${index}: ${value}`;
});

console.log(result);
// ["0: a", "1: b", "2: c"]
    
    </script>
</body>
</html>
