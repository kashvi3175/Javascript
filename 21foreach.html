<body>
  <script>
    //for each
    //used to loop through an array
    //syntax array foreach((element,index))=>{code});

    const numbers=[1,2,3];
    numbers.forEach((num,index)=>{
console.log(num,index);
    });



    const nums = [1, 2, 3];

const result = nums.forEach(num => num * 2);

console.log(result); // undefined cannot make new



    //object
    const details=[{name:'rohit',age:86},{name:'shiva',age:53}];
    details.forEach((person)=>{
      console.log(person.name,person.age);
    });
      </script>
</body>
